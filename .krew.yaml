apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: oskar
spec:
  version: {{ .TagName }}
  # The krew-release-bot uses `homepage` to prove ownership: it must be the
  # GitHub repository the releases are published from.
  homepage: https://github.com/alessandrocorsico/oskar
  # krew-index review rules: describe WHAT the checks do, never HOW to run
  # them (no command lines in description/caveats); keep shortDescription
  # within ~50 characters.
  shortDescription: "Finds broken links: ghost endpoints, dead webhooks"
  description: |
    OSKAR (Open Source Kubernetes Anomaly Radar) performs a read-only scan of
    the cluster and reports silent state inconsistencies: the broken links
    between objects that raise no events and keep every dashboard green.

    Checks: EndpointSlice entries pointing at pods that no longer exist or at
    IPs the pod does not own (ghost endpoints); admission webhooks whose
    backend Service is missing or has no ready endpoints; Ingresses and
    OpenShift Routes referencing non-existent Services or ports; Services
    whose selector matches no pods; TLS Secrets expired or about to expire;
    Pods, Namespaces and PVCs stuck in Terminating; Released or Failed
    PersistentVolumes; HorizontalPodAutoscalers whose scale target is gone.

    Every finding carries a remediation hint. Output is a human-readable
    table or JSON, and exit codes make it usable as a CI/CD gate. It needs
    only list permissions; a check whose resources cannot be listed is
    skipped with a notice, never run on empty data.
  caveats: |
    OSKAR is read-only and needs the "list" verb on the resources it
    inspects. The certificate check lists Secrets of type kubernetes.io/tls
    only; if your RBAC forbids access to Secrets, that single check can be
    disabled and everything else keeps working.
  # Archive names come from .goreleaser.yaml: oskar_<os>_<arch>.tar.gz
  # (zip on Windows). LICENSE is extracted from every archive, as the
  # krew-index requires.
  #
  # Indentation matters: krew-release-bot renders addURIAndSha as
  # "uri: ...\n    sha256: ..." with a fixed 4-space indent, so platform
  # entries must sit at 2 spaces and their keys at 4, exactly like this.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_linux_amd64.tar.gz" .TagName }}
    files:
    - from: oskar
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_linux_arm64.tar.gz" .TagName }}
    files:
    - from: oskar
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_darwin_amd64.tar.gz" .TagName }}
    files:
    - from: oskar
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_darwin_arm64.tar.gz" .TagName }}
    files:
    - from: oskar
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_windows_amd64.zip" .TagName }}
    files:
    - from: oskar.exe
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/alessandrocorsico/oskar/releases/download/{{ .TagName }}/oskar_windows_arm64.zip" .TagName }}
    files:
    - from: oskar.exe
      to: "."
    - from: LICENSE
      to: "."
    bin: oskar.exe
