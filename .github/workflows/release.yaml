name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release and assets
  packages: write # ghcr.io image
  id-token: write # keyless cosign signing (Sigstore)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      - uses: anchore/sbom-action/download-syft@v0
      # 1. Build the binaries, archives, checksums, SBOMs, signatures and the
      #    multi-arch image, and publish the GitHub Release.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Open (or update) the PR to the krew-index for this release.
      #    On the FIRST release this opens a PR that krew maintainers review
      #    manually; subsequent releases are auto-merged version bumps.
      #    Needs no secret: the bot runs as a hosted service, reads the public
      #    release assets and opens the PR from its own fork. The `homepage`
      #    in .krew.yaml must match this repository (ownership check).
      - name: Update krew-index
        uses: rajatjindal/krew-release-bot@v0.0.51
        with:
          krew_template_file: .krew.yaml
